<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle for maskable/app icon -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Emblem Shield Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.4" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />

  <!-- MININT Shield -->
  <path d="M 256 90 L 370 140 C 370 280 256 390 256 390 C 256 390 142 280 142 140 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Inner Gold Star / Emblem Accent -->
  <polygon points="256,150 270,195 316,195 279,222 293,267 256,240 219,267 233,222 196,195 242,195" fill="url(#goldGrad)" />

  <!-- Book Symbol inside Shield -->
  <path d="M 196 280 Q 256 265 256 295 Q 256 265 316 280 L 316 335 Q 256 320 256 345 Q 256 320 196 335 Z" 
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
  
  <line x1="256" y1="295" x2="256" y2="345" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- Text Arc / Title Badge -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#fbbf24" text-anchor="middle" letter-spacing="4">
    MININT
  </text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">
    PREPARATÓRIO
  </text>
</svg>
